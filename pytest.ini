[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    api: API tests
    ui: UI end-to-end tests
    smoke: High-value tests that validate critical application availability
    regression: Tests that protect existing behavior
    e2e: End-to-end tests that cover complete user journeys
    negative: Tests that validate error handling or restricted behavior
